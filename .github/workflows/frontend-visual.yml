name: frontend-visual-evidence

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      EFHC_E2E_BASE_URL: http://127.0.0.1:3000
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Init screenshot artifacts
        run: |
          rm -rf ci_artifacts extracted
          mkdir -p ci_artifacts/screenshots

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Ensure and unzip efhc.zip
        run: |
          test -f efhc.zip || \
            (echo "ERROR: efhc.zip missing" && exit 1)
          sha256sum efhc.zip | tee ci_artifacts/efhc_zip_sha256.txt
          unzip -q efhc.zip -d extracted
          find extracted -maxdepth 12 -name ".npmrc" \
            -print -delete || true
          test -d extracted/frontend || exit 1
          test -f extracted/frontend/package-lock.json || exit 1
          test -f extracted/requirements-visual.txt || exit 1
          test -f \
            extracted/ops/frontend/all_pages_visual_manifest_v171_88.json \
            || exit 1

      - name: Prepare embedded screenshot runner
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/efhc_capture_screenshots.py <<'PYCODE'
          from __future__ import annotations

          import argparse
          import json
          import sys
          import time
          from pathlib import Path
          from typing import Any

          import requests
          from playwright.sync_api import Page, sync_playwright


          def _slug(route: str) -> str:
              return route.strip("/").replace("/", "__") or "root"


          def _load_helpers(
              project_root: Path,
          ) -> tuple[Any, Any, Any, Any, Any, Any]:
              helpers = project_root / "ops/frontend"
              sys.path.insert(0, str(helpers))

              from admin_visual_button_click_proof import (  # noqa: PLC0415
                  _capture_screenshot,
                  _chromium_path,
                  _install_admin_fallback,
                  _launch_kwargs,
                  _route_request,
              )
              from public_visual_runtime_proof import (  # noqa: PLC0415
                  _install_public_fallback,
              )

              return (
                  _capture_screenshot,
                  _chromium_path,
                  _install_admin_fallback,
                  _install_public_fallback,
                  _launch_kwargs,
                  _route_request,
              )


          def _inject_document_context(
              html: str,
              *,
              base_url: str,
              kind: str,
              route: str,
          ) -> str:
              base = f'<base href="{base_url.rstrip("/")}/">'
              proof = ""
              if kind == "admin":
                  proof = (
                      "<script>window.__EFHC_ADMIN_PROOF_PATH__="
                      f"{json.dumps(route)};</script>"
                  )
              injected = f"{base}{proof}"
              if "<head>" in html:
                  return html.replace("<head>", f"<head>{injected}", 1)
              return f"{injected}{html}"


          def _load_route_document(
              page: Page,
              session: requests.Session,
              *,
              base_url: str,
              route: str,
              kind: str,
          ) -> int:
              response = session.get(f"{base_url}{route}")
              html = _inject_document_context(
                  response.text,
                  base_url=base_url,
                  kind=kind,
                  route=route,
              )
              page.set_content(
                  html,
                  wait_until="load",
                  timeout=0,
              )
              return response.status_code


          def _wait_until_rendered(page: Page, marker: str) -> bool:
              page.wait_for_function(
                  "() => document.readyState === 'complete'",
                  timeout=0,
              )
              page.wait_for_function(
                  "() => document.documentElement.dataset.efhcShell === 'ready'",
                  timeout=0,
              )
              page.locator(marker).first.wait_for(
                  state="attached",
                  timeout=0,
              )
              page.evaluate(
                  "() => document.fonts ? document.fonts.ready : Promise.resolve()"
              )
              return True


          def _capture(
              page: Page,
              session: requests.Session,
              capture_screenshot: Any,
              *,
              base_url: str,
              item: dict[str, Any],
              kind: str,
              viewport: dict[str, Any],
              output_dir: Path,
          ) -> dict[str, Any]:
              width = int(viewport["width"])
              height = int(viewport["height"])
              route = str(item["route"])
              marker = str(item["marker"])
              shot = output_dir / (
                  f"{kind}__{_slug(route)}__{width}x{height}.png"
              )
              shot.parent.mkdir(parents=True, exist_ok=True)

              started = time.monotonic()
              status_code = _load_route_document(
                  page,
                  session,
                  base_url=base_url,
                  route=route,
                  kind=kind,
              )
              marker_seen = _wait_until_rendered(page, marker)

              # CDP делает обычный снимок текущего viewport без Playwright
              # screenshot lifecycle, который зависал под policy-managed Chromium.
              capture_screenshot(page, shot)

              elapsed = round(time.monotonic() - started, 3)
              exists = shot.exists() and shot.stat().st_size > 0

              print(
                  "[viewport-screenshot] "
                  f"{kind} {route} {width}x{height} "
                  f"status={status_code} seconds={elapsed} "
                  f"png={'yes' if exists else 'no'} "
                  f"bytes={shot.stat().st_size if exists else 0}",
                  flush=True,
              )

              return {
                  "kind": kind,
                  "route": route,
                  "viewport": {
                      "name": viewport.get("name"),
                      "width": width,
                      "height": height,
                  },
                  "http_status": status_code,
                  "expected_http_status": int(item.get("expected_status", 200)),
                  "marker": marker,
                  "marker_seen": marker_seen,
                  "screenshot": str(shot),
                  "screenshot_bytes": shot.stat().st_size if exists else 0,
                  "seconds": elapsed,
                  "error": None,
                  "screenshot_created": exists,
              }


          def _capture_group(
              browser: Any,
              session: requests.Session,
              capture_screenshot: Any,
              *,
              base_url: str,
              viewport: dict[str, Any],
              kind: str,
              items: list[dict[str, Any]],
              output_dir: Path,
              install_fallback: Any,
              route_request: Any,
          ) -> list[dict[str, Any]]:
              context = browser.new_context(
                  viewport={
                      "width": int(viewport["width"]),
                      "height": int(viewport["height"]),
                  },
                  device_scale_factor=1,
                  service_workers="block",
                  reduced_motion="reduce",
                  color_scheme="dark",
              )
              context.route(
                  "**/*",
                  lambda route: route_request(route, proxy_local=False),
              )
              page = context.new_page()
              page.set_default_timeout(0)
              page.set_default_navigation_timeout(0)
              install_fallback(page)

              try:
                  return [
                      _capture(
                          page,
                          session,
                          capture_screenshot,
                          base_url=base_url,
                          item=item,
                          kind=kind,
                          viewport=viewport,
                          output_dir=output_dir,
                      )
                      for item in items
                  ]
              finally:
                  context.close()


          def run(
              *,
              project_root: Path,
              base_url: str,
              output_dir: Path,
              report_path: Path,
          ) -> dict[str, Any]:
              project_root = project_root.resolve()
              manifest_path = (
                  project_root
                  / "ops/frontend/all_pages_visual_manifest_v171_88.json"
              )
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

              (
                  capture_screenshot,
                  chromium_path,
                  install_admin_fallback,
                  install_public_fallback,
                  launch_kwargs,
                  route_request,
              ) = _load_helpers(project_root)

              base_url = base_url.rstrip("/")
              output_dir = output_dir.resolve()
              output_dir.mkdir(parents=True, exist_ok=True)

              public_and_system = (
                  list(manifest["public_routes"])
                  + list(manifest["system_routes"])
              )
              admin_routes = list(manifest["admin_routes"])
              results: list[dict[str, Any]] = []

              started = time.monotonic()
              executable = chromium_path()

              with requests.Session() as session:
                  with sync_playwright() as playwright:
                      browser = playwright.chromium.launch(
                          **launch_kwargs(executable)
                      )
                      try:
                          for viewport in manifest["viewports"]:
                              results.extend(
                                  _capture_group(
                                      browser,
                                      session,
                                      capture_screenshot,
                                      base_url=base_url,
                                      viewport=viewport,
                                      kind="public",
                                      items=public_and_system,
                                      output_dir=output_dir,
                                      install_fallback=lambda page: (
                                          install_public_fallback(
                                              page,
                                              "ru",
                                              base_url,
                                          )
                                      ),
                                      route_request=route_request,
                                  )
                              )
                              results.extend(
                                  _capture_group(
                                      browser,
                                      session,
                                      capture_screenshot,
                                      base_url=base_url,
                                      viewport=viewport,
                                      kind="admin",
                                      items=admin_routes,
                                      output_dir=output_dir,
                                      install_fallback=lambda page: (
                                          install_admin_fallback(page, base_url)
                                      ),
                                      route_request=route_request,
                                  )
                              )
                      finally:
                          browser.close()

              routes = len(public_and_system) + len(admin_routes)
              viewports = len(manifest["viewports"])
              expected = routes * viewports
              created = sum(
                  1 for result in results if result["screenshot_created"]
              )
              elapsed = round(time.monotonic() - started, 3)

              report = {
                  "schema": "EFHC_VIEWPORT_SCREENSHOTS_V2",
                  "purpose": "fresh viewport PNG only",
                  "deep_e2e_audit": False,
                  "full_page": False,
                  "browser": "chromium",
                  "capture_engine": "CDP Page.captureScreenshot",
                  "document_loader": "HTTP + page.set_content",
                  "per_route_timeout": False,
                  "job_timeout_override": False,
                  "chromium_executable": executable,
                  "base_url": base_url,
                  "routes": routes,
                  "viewports": viewports,
                  "screenshots_expected": expected,
                  "screenshots_created": created,
                  "status": "PASSED" if created == expected else "FAILED",
                  "total_seconds": elapsed,
                  "results": results,
              }
              report_path.parent.mkdir(parents=True, exist_ok=True)
              report_path.write_text(
                  json.dumps(report, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              print(
                  json.dumps(
                      {
                          "status": report["status"],
                          "screenshots_created": created,
                          "screenshots_expected": expected,
                          "total_seconds": elapsed,
                          "report": str(report_path),
                      },
                      ensure_ascii=False,
                      indent=2,
                  ),
                  flush=True,
              )

              if created != expected:
                  raise SystemExit(1)
              return report


          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--project-root", default="extracted")
              parser.add_argument(
                  "--base-url",
                  default="http://127.0.0.1:3000",
              )
              parser.add_argument(
                  "--output-dir",
                  default="ci_artifacts/screenshots",
              )
              parser.add_argument(
                  "--report",
                  default="ci_artifacts/screenshots_report.json",
              )
              args = parser.parse_args()

              run(
                  project_root=Path(args.project_root),
                  base_url=args.base_url,
                  output_dir=Path(args.output_dir),
                  report_path=Path(args.report),
              )


          if __name__ == "__main__":
              main()
          PYCODE
          python -m py_compile \
            .github/scripts/efhc_capture_screenshots.py

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r extracted/requirements-visual.txt
          python -m playwright install --with-deps chromium

          cd extracted/frontend
          npm config set registry https://registry.npmjs.org/
          npm ci --no-audit --no-fund --progress=false

      - name: Build exact frontend
        env:
          NEXT_PUBLIC_ADMIN_TG_IDS: "1"
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: "1"
        working-directory: extracted/frontend
        run: npm run build

      - name: Capture 102 fresh viewport PNG
        env:
          NEXT_PUBLIC_ADMIN_TG_IDS: "1"
          NEXT_PUBLIC_EFHC_ADMIN_VISUAL_PROOF: "1"
        run: |
          server_pid=""

          finish() {
            if test -n "$server_pid"; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap finish EXIT

          (
            cd extracted/frontend
            npm run start -- --hostname 127.0.0.1 \
              > ../../ci_artifacts/frontend_server.txt 2>&1
          ) &
          server_pid=$!

          until curl --fail --silent --show-error \
            "$EFHC_E2E_BASE_URL/" >/dev/null; do
            echo "WAIT: frontend not ready"
            sleep 1
          done
          echo "OK: frontend ready"

          python .github/scripts/efhc_capture_screenshots.py \
            --project-root extracted \
            --base-url "$EFHC_E2E_BASE_URL" \
            --output-dir ci_artifacts/screenshots \
            --report ci_artifacts/screenshots_report.json \
            2>&1 | tee ci_artifacts/screenshots_run.txt

          count="$(
            find ci_artifacts/screenshots \
              -type f -name '*.png' | wc -l
          )"
          echo "screenshots=$count" \
            | tee ci_artifacts/screenshots_count.txt
          test "$count" = "102"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-evidence-${{ github.run_id }}
          path: ci_artifacts
          if-no-files-found: error
          retention-days: 14
